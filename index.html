<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heute.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --border: #2a2a2a;
    --border-hi: #444;
    --text: #f0f0f0;
    --muted: #666;
    --radius: 10px;
    --maxw: 900px;
    --ease: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body.locked > *:not(#gate) { display: none !important; }

  /* ---------- gate ---------- */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #gate[hidden] { display: none; }

  #gate-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #gate-input {
    width: 260px;
    padding: 15px 18px;
    text-align: center;
    font-family: inherit;
    font-size: 17px;
    letter-spacing: 3px;
    color: #222;
    background: #fbfbfb;
    border: 1px solid #e2e2e2;
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--ease), background var(--ease);
  }

  #gate-input:disabled { opacity: 0.6; }
  #gate-input::placeholder { color: #bbb; letter-spacing: 1px; }
  #gate-input:focus { border-color: #ccc; background: #fff; }

  #gate-input.shake {
    border-color: #e08080;
    animation: shake 0.35s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  #gate-error {
    height: 14px;
    font-size: 12px;
    letter-spacing: 0.3px;
    color: #c0392b;
    opacity: 0;
    transition: opacity var(--ease);
  }

  #gate-error.show { opacity: 1; }

  /* ---------- header + search ---------- */

  header {
    width: 100%;
    max-width: var(--maxw);
    padding: 60px 24px 24px;
    text-align: center;
  }

  header h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .search-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    max-width: var(--maxw);
    padding: 16px 24px 32px;
    background: linear-gradient(var(--bg) 85%, transparent);
  }

  #search {
    width: 100%;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--ease);
  }

  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--border-hi); }

  .results-info {
    width: 100%;
    max-width: var(--maxw);
    padding: 0 24px 16px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- grid + cards ---------- */

  .grid {
    width: 100%;
    max-width: var(--maxw);
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .grid.single-result { grid-template-columns: 1fr; }

  .card {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--ease), transform var(--ease);
  }

  .card:hover,
  .card:focus-visible { border-color: var(--border-hi); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid #5a5aff; outline-offset: 2px; }

  .card.spotlight {
    grid-column: 1 / -1;
    max-width: 700px;
    margin: 0 auto;
    animation: spotlight-in 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes spotlight-in {
    from { opacity: 0.4; transform: scale(0.95); }
    to   { opacity: 1;   transform: scale(1); }
  }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* first frame of the video; sits above the fallback label */
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* shown behind the image only when the frame fails to load */
  .thumb-label {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #2a2a2a;
    user-select: none;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity var(--ease);
  }

  .card:hover .play-overlay,
  .card:focus-visible .play-overlay { opacity: 1; }

  .play-overlay svg { width: 48px; height: 48px; fill: #fff; }

  .card-body { padding: 14px 16px; }

  .card-num {
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-title {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }

  /* ---------- tags ---------- */

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: 4px;
    background: #222;
    color: #999;
    border: 1px solid #2c2c2c;
  }

  .tag.person { background: #1a1a2e; color: #8888cc; border-color: #2a2a4a; }
  .tag.game   { background: #1a2a1a; color: #77aa77; border-color: #2a3a2a; }

  /* ---------- modal ---------- */

  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.92);
  }

  .modal-bg.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 960px;
    padding: 0 20px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 14px;
  }

  .modal-num {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .modal-title { margin-top: 2px; font-size: 18px; font-weight: 700; }

  .close-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--muted);
    background: none;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color var(--ease), color var(--ease);
  }

  .close-btn:hover { border-color: var(--muted); color: var(--text); }

  .player-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .player-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 0 20px;
  }

  .no-results {
    grid-column: 1 / -1;
    padding: 60px 0;
    text-align: center;
    font-size: 15px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card:hover { transform: none; }
  }
</style>
</head>

  </form>
</div>

<header><h1>heute.</h1></header>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">

    <div class="modal-tags" id="modal-tags"></div>

</div>

/* ============================ crypto ============================ */

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKek(password, salt) {
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: BLOB.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

// returns the decoded payload object, or null if the password fits no wrap
async function decryptPayload(password) {
  for (const w of BLOB.wraps) {
    try {
      const kek = await deriveKek(password, b64ToBytes(w.salt));
      const rawKey = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(w.iv) }, kek, b64ToBytes(w.key));
      const contentKey = await crypto.subtle.importKey(
        "raw", rawKey, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(BLOB.iv) }, contentKey, b64ToBytes(BLOB.ct));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch {
      // wrong password for this wrap (GCM tag mismatch) — try the next one
    }
  }
  return null;
}

/* ============================ data (filled after unlock) ============================ */

let PEOPLE = {};
let VIDEOS = [];

const realName = (p) => PEOPLE[p]?.real || "?";
const aliasesOf = (p) => PEOPLE[p]?.aka || [];
const videoTitle = (v) => v.games.join(", ");

// youtube serves the opening frame at maxresdefault; mqdefault is the
// low-res fallback for videos that have no maxres rendition
const frameUrl = (videoId, quality = "maxresdefault") =>
  `https://i.ytimg.com/vi/${videoId}/${quality}.jpg`;

/* ============================ gate ============================ */

function showGateError() {
  const input = $("gate-input");
  $("gate-error").classList.add("show");
  input.classList.remove("shake");
  void input.offsetWidth; // restart the animation
  input.classList.add("shake");
  input.value = "";
}

function unlockSite(payload) {
  PEOPLE = payload.people;
  VIDEOS = payload.videos;
  document.body.classList.remove("locked");
  $("gate").hidden = true;
  renderCards("");
  $("search").focus();
}

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("gate-input");
  const value = input.value;
  if (!value) return;

  input.disabled = true;
  const payload = await decryptPayload(value); // PBKDF2 is intentionally slow
  input.disabled = false;

  if (payload) unlockSite(payload);
  else { showGateError(); input.focus(); }
});

$("gate-input").addEventListener("input", () => $("gate-error").classList.remove("show"));
$("gate-input").focus();

/* ============================ search ============================ */

// "Make It Meme" -> ["make","it","meme"]
const wordsOf = (str) => String(str || "").toLowerCase().split(/\s+/).filter(Boolean);

function matchesToken(v, token) {
  const t = token.toLowerCase();
  if (!t || t === "heute") return true;

  const num = t.match(/^(?:heute\s*)?(\d+)$/);
  if (num && Number(num[1]) === v.id) return true;

  // word-prefix match instead of includes-anywhere, so "it" doesn't hit "Fortnite" or "Kit"
  const hit = (str) => wordsOf(str).some(w => w.startsWith(t));
  const personHit = (p) => hit(p) || hit(realName(p)) || aliasesOf(p).some(hit);
  return v.persons.some(personHit) || v.games.some(hit);
}

const matches = (v, q) =>
  q.trim().split(/\s+/).filter(Boolean).every(tok => matchesToken(v, tok));

/* ============================ rendering ============================ */

const escapeHtml = (str) =>
  String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const personTag = (p, withReal) =>
  `<span class="tag person"${withReal ? "" : ` title="${escapeHtml(realName(p))}"`}>` +
  escapeHtml(withReal ? `${p} (${realName(p)})` : p) + `</span>`;

const gameTag = (g) => `<span class="tag game">${escapeHtml(g)}</span>`;

function buildThumb(v) {
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  thumb.innerHTML = `
    <span class="thumb-label">heute ${v.id}</span>
    <div class="play-overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>`;

  const img = document.createElement("img");
  img.src = frameUrl(v.videoId);
  img.alt = `erster frame von heute ${v.id}`;
  img.loading = "lazy";
  img.decoding = "async";
  img.addEventListener("error", () => {
    // maxres missing -> try the low-res frame once, then fall back to the label
    if (img.dataset.retried) img.remove();
    else { img.dataset.retried = "1"; img.src = frameUrl(v.videoId, "mqdefault"); }
  });
  thumb.prepend(img);

  return thumb;
}

function buildCard(v, spotlight) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card" + (spotlight ? " spotlight" : "");
  card.addEventListener("click", () => openModal(v));

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <div class="card-num">heute ${v.id}</div>
    <div class="card-title">${escapeHtml(videoTitle(v))}</div>
    <div class="tags">
      ${v.persons.map(p => personTag(p, false)).join("")}
      ${v.games.map(gameTag).join("")}
    </div>`;

  card.append(buildThumb(v), body);
  return card;
}

function renderCards(q) {
  const grid = $("grid");
  const info = $("results-info");
  const filtered = VIDEOS.filter(v => matches(v, q));

  grid.replaceChildren();

  if (!filtered.length) {
    grid.className = "grid";
    grid.innerHTML = '<div class="no-results">nichts gefunden.</div>';
    info.textContent = "";
    return;
  }

  const single = filtered.length === 1;
  grid.className = "grid" + (single ? " single-result" : "");
  info.textContent = filtered.length === VIDEOS.length
    ? `${VIDEOS.length} videos`
    : `${filtered.length} von ${VIDEOS.length} videos`;

  grid.append(...filtered.map(v => buildCard(v, single)));
}

/* ============================ modal ============================ */

let ytPaused = false;

function postToPlayer(func) {
  $("player-iframe").contentWindow.postMessage(
    JSON.stringify({ event: "command", func, args: "" }), "*");
}

function openModal(v) {
  ytPaused = false;

  $("modal-num").textContent = `HEUTE ${v.id}`;
  $("modal-title").textContent = videoTitle(v);
  $("modal-tags").innerHTML =
    v.persons.map(p => personTag(p, true)).join("") + v.games.map(gameTag).join("");

  $("player-iframe").src =
    `https://www.youtube-nocookie.com/embed/${v.videoId}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1`;

  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  $("modal").classList.remove("open");
  $("player-iframe").src = "about:blank"; // stops playback; "" would reload this page into the frame
  document.body.style.overflow = "";
}

const modalIsOpen = () => $("modal").classList.contains("open");

$("close-btn").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
$("search").addEventListener("input", (e) => renderCards(e.target.value));

document.addEventListener("keydown", (e) => {
  if (!modalIsOpen()) return;

  if (e.key === "Escape") { closeModal(); return; }
  if (document.activeElement.tagName === "INPUT") return;

  if (e.code === "Space") {
    e.preventDefault();
    postToPlayer(ytPaused ? "playVideo" : "pauseVideo");
    ytPaused = !ytPaused;
  } else if (e.key.toLowerCase() === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.querySelector(".player-wrap").requestFullscreen().catch(() => {});
  }
});
</script>
