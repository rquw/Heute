<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heute.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --border: #2a2a2a;
    --border-hi: #444;
    --text: #f0f0f0;
    --muted: #666;
    --radius: 10px;
    --maxw: 900px;
    --ease: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body.locked > *:not(#gate) { display: none !important; }

  /* ---------- gate ---------- */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #gate[hidden] { display: none; }

  #gate-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #gate-input {
    width: 260px;
    padding: 15px 18px;
    text-align: center;
    font-family: inherit;
    font-size: 17px;
    letter-spacing: 3px;
    color: #222;
    background: #fbfbfb;
    border: 1px solid #e2e2e2;
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--ease), background var(--ease);
  }

  #gate-input::placeholder { color: #bbb; letter-spacing: 1px; }
  #gate-input:focus { border-color: #ccc; background: #fff; }

  #gate-input.shake {
    border-color: #e08080;
    animation: shake 0.35s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  #gate-error {
    height: 14px;
    font-size: 12px;
    letter-spacing: 0.3px;
    color: #c0392b;
    opacity: 0;
    transition: opacity var(--ease);
  }

  #gate-error.show { opacity: 1; }

  /* ---------- header + search ---------- */

  header {
    width: 100%;
    max-width: var(--maxw);
    padding: 60px 24px 24px;
    text-align: center;
  }

  header h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .search-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    max-width: var(--maxw);
    padding: 16px 24px 32px;
    background: linear-gradient(var(--bg) 85%, transparent);
  }

  #search {
    width: 100%;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--ease);
  }

  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--border-hi); }

  .results-info {
    width: 100%;
    max-width: var(--maxw);
    padding: 0 24px 16px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- grid + cards ---------- */

  .grid {
    width: 100%;
    max-width: var(--maxw);
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .grid.single-result { grid-template-columns: 1fr; }

  .card {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--ease), transform var(--ease);
  }

  .card:hover,
  .card:focus-visible { border-color: var(--border-hi); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid #5a5aff; outline-offset: 2px; }

  .card.spotlight {
    grid-column: 1 / -1;
    max-width: 700px;
    margin: 0 auto;
    animation: spotlight-in 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes spotlight-in {
    from { opacity: 0.4; transform: scale(0.95); }
    to   { opacity: 1;   transform: scale(1); }
  }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* first frame of the video; sits above the fallback label */
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* shown through/behind the image only when the frame fails to load */
  .thumb-label {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #2a2a2a;
    user-select: none;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity var(--ease);
  }

  .card:hover .play-overlay,
  .card:focus-visible .play-overlay { opacity: 1; }

  .play-overlay svg { width: 48px; height: 48px; fill: #fff; }

  .card-body { padding: 14px 16px; }

  .card-num {
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-title {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }

  /* ---------- tags ---------- */

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: 4px;
    background: #222;
    color: #999;
    border: 1px solid #2c2c2c;
  }

  .tag.person { background: #1a1a2e; color: #8888cc; border-color: #2a2a4a; }
  .tag.game   { background: #1a2a1a; color: #77aa77; border-color: #2a3a2a; }

  /* ---------- modal ---------- */

  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.92);
  }

  .modal-bg.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 960px;
    padding: 0 20px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 14px;
  }

  .modal-num {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .modal-title { margin-top: 2px; font-size: 18px; font-weight: 700; }

  .close-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--muted);
    background: none;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color var(--ease), color var(--ease);
  }

  .close-btn:hover { border-color: var(--muted); color: var(--text); }

  .player-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .player-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 0 20px;
  }

  .no-results {
    grid-column: 1 / -1;
    padding: 60px 0;
    text-align: center;
    font-size: 15px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body class="locked">

<div id="gate">
  <form id="gate-form" autocomplete="off">
    <input id="gate-input" type="password" placeholder="passwort" autocomplete="off" aria-label="passwort">
    <div id="gate-error" role="alert">falsch.</div>
  </form>
</div>

<header><h1>heute.</h1></header>

<div class="search-wrap">
  <input id="search" type="search" autocomplete="off" aria-label="suche"
         placeholder="suche nach video, person, spiel… mehrere tags mit leerzeichen trennen">
</div>

<div class="results-info" id="results-info" aria-live="polite"></div>
<div class="grid" id="grid"></div>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-num" id="modal-num"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="close-btn" id="close-btn" aria-label="schließen">×</button>
    </div>

    <div class="player-wrap">
      <iframe id="player-iframe" title="video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        allowfullscreen></iframe>
    </div>

    <div class="modal-tags" id="modal-tags"></div>
  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

/* ============================ gate ============================ */

const GATE_HASHES = new Set([
  "1b879216dc17755c07c11fd2b7e15dd8df5ef7f8c0a3f27e1c6f0ddb4d2c03b6",
  "46ddd8196f72b3e629511ce5c746aaaa82d53df3f9a3e8831d653bbb04ccf13e",
  "6e65b61d030e5ac6492802c6f619a63006e5b0e2cafc0170ab92a68083162528",
  "85d6385b945c0d602103db39b0b654b2af93b5127938e26a959c123f0789b948",
  "5ad4fca71d720f79036d7ba27b999f6a423d69b57877558d43e5d6bdd7b7a8a9",
  "75992a5ac67ff644d3063976c2effd10bdd93fcc109798e3d5c1acf2e530d01a",
  "f9c6f275600d0a3a06264cca302f245e442e2f5d7283d16eab7f555735519916",
]);

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function showGateError() {
  const input = $("gate-input");
  $("gate-error").classList.add("show");
  input.classList.remove("shake");
  void input.offsetWidth; // restart the animation
  input.classList.add("shake");
  input.value = "";
}

function unlockSite() {
  document.body.classList.remove("locked");
  $("gate").hidden = true;
  renderCards("");
  $("search").focus();
}

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const value = $("gate-input").value;
  if (value && GATE_HASHES.has(await sha256Hex(value))) unlockSite();
  else showGateError();
});

$("gate-input").addEventListener("input", () => $("gate-error").classList.remove("show"));
$("gate-input").focus();

/* ============================ data ============================ */

const PEOPLE = {
  rquw:      "Fabio",
  CloudMelt: "Chrisi",
  Zaykee:    "Niki",
  Cookeey:   "Jaks",
  XRClon:    "Xaver",
  Kit:       "Martin",
  Todoroki:  "Nao",
};

const VIDEOS = [
  { id: 1,  videoId: "GgY-qG66mRI", persons: ["rquw", "CloudMelt", "XRClon"],
    games: ["Wobbly Life", "Minecraft Bedwars", "Roblox Rivals"] },
  { id: 2,  videoId: "7BeJxzEZVz0", persons: ["rquw", "XRClon"],
    games: ["Roblox Rivals"] },
  { id: 3,  videoId: "-GqyFOPw3QU", persons: ["rquw", "CloudMelt", "Zaykee", "XRClon", "Kit"],
    games: ["Make It Meme", "Richup", "Roblox Rivals", "Minecraft"] },
  { id: 4,  videoId: "jJZ6pZ5v80c", persons: ["rquw", "CloudMelt", "Zaykee", "XRClon"],
    games: ["Piko Park"] },
  { id: 5,  videoId: "iY3rKzpOrvc", persons: ["rquw", "CloudMelt", "Zaykee"],
    games: ["Minecraft Survival", "Cookee", "Todoroki2009"] },
  { id: 6,  videoId: "fjtYULoGSzo", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey", "XRClon"],
    games: ["Minecraft Survival"] },
  { id: 7,  videoId: "rTbi1m5G4ig", persons: ["rquw", "CloudMelt", "Zaykee", "XRClon"],
    games: ["Minecraft Survival"] },
  { id: 8,  videoId: "QQPmDQPha2k", persons: ["rquw", "CloudMelt"],
    games: ["Minecraft Survival"] },
  { id: 9,  videoId: "GH9lQULIt9o", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey", "XRClon"],
    games: ["Minecraft Survival"] },
  { id: 10, videoId: "cBykPOuAwr4", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey"],
    games: ["Minecraft Bedwars", "Minecraft Creative", "Fortnite"] },
  { id: 11, videoId: "VrbcR2ZBbyA", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey", "XRClon", "Kit", "Todoroki"],
    games: ["Fortnite", "Minecraft Bedwars", "Minecraft Skywars", "Among Us"] },
  { id: 12, videoId: "F3VUL6C5rFY", persons: ["rquw", "CloudMelt", "Zaykee", "Todoroki"],
    games: ["Roblox Rivals", "Roblox Desert"] },
  { id: 13, videoId: "Y7DTQwOMN8A", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey", "Kit"],
    games: ["rv there yet?"] },
  { id: 14, videoId: "fwY00FFB1yc", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey", "XRClon"],
    games: ["Rounds", "Rocket League", "Minecraft Survival"] },
  { id: 15, videoId: "5taV9lOyoro", persons: ["rquw", "CloudMelt", "Zaykee", "Cookeey", "XRClon"],
    games: ["Minecraft"] },
  { id: 16, videoId: "-EKAeiQqwzY", persons: ["rquw", "CloudMelt", "Cookeey", "Kit", "XRClon"],
    games: ["Minecraft", "Backrooms"] },
];

const realName = (person) => PEOPLE[person] || "?";
const videoTitle = (v) => v.games.join(", ");

// youtube serves the opening frame at maxresdefault; mqdefault is the
// low-res fallback for videos that have no maxres rendition
const frameUrl = (videoId, quality = "maxresdefault") =>
  `https://i.ytimg.com/vi/${videoId}/${quality}.jpg`;

/* ============================ search ============================ */

// "Make It Meme" -> ["make","it","meme"]
const wordsOf = (str) => String(str || "").toLowerCase().split(/\s+/).filter(Boolean);

function matchesToken(v, token) {
  const t = token.toLowerCase();
  if (!t || t === "heute") return true;

  const num = t.match(/^(?:heute\s*)?(\d+)$/);
  if (num && Number(num[1]) === v.id) return true;

  // word-prefix match instead of includes-anywhere, so "it" doesn't hit "Fortnite" or "Kit"
  const hit = (str) => wordsOf(str).some(w => w.startsWith(t));
  return v.persons.some(p => hit(p) || hit(realName(p))) || v.games.some(hit);
}

const matches = (v, q) =>
  q.trim().split(/\s+/).filter(Boolean).every(tok => matchesToken(v, tok));

/* ============================ rendering ============================ */

const escapeHtml = (str) =>
  String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const personTag = (p, withReal) =>
  `<span class="tag person"${withReal ? "" : ` title="${escapeHtml(realName(p))}"`}>` +
  escapeHtml(withReal ? `${p} (${realName(p)})` : p) + `</span>`;

const gameTag = (g) => `<span class="tag game">${escapeHtml(g)}</span>`;

function buildThumb(v) {
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  thumb.innerHTML = `
    <span class="thumb-label">heute ${v.id}</span>
    <div class="play-overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>`;

  const img = document.createElement("img");
  img.src = frameUrl(v.videoId);
  img.alt = `erster frame von heute ${v.id}`;
  img.loading = "lazy";
  img.decoding = "async";
  img.addEventListener("error", () => {
    // maxres missing -> try the low-res frame once, then fall back to the label
    if (img.dataset.retried) img.remove();
    else { img.dataset.retried = "1"; img.src = frameUrl(v.videoId, "mqdefault"); }
  });
  thumb.prepend(img);

  return thumb;
}

function buildCard(v, spotlight) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card" + (spotlight ? " spotlight" : "");
  card.addEventListener("click", () => openModal(v));

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <div class="card-num">heute ${v.id}</div>
    <div class="card-title">${escapeHtml(videoTitle(v))}</div>
    <div class="tags">
      ${v.persons.map(p => personTag(p, false)).join("")}
      ${v.games.map(gameTag).join("")}
    </div>`;

  card.append(buildThumb(v), body);
  return card;
}

function renderCards(q) {
  const grid = $("grid");
  const info = $("results-info");
  const filtered = VIDEOS.filter(v => matches(v, q));

  grid.replaceChildren();

  if (!filtered.length) {
    grid.className = "grid";
    grid.innerHTML = '<div class="no-results">nichts gefunden.</div>';
    info.textContent = "";
    return;
  }

  const single = filtered.length === 1;
  grid.className = "grid" + (single ? " single-result" : "");
  info.textContent = filtered.length === VIDEOS.length
    ? `${VIDEOS.length} videos`
    : `${filtered.length} von ${VIDEOS.length} videos`;

  grid.append(...filtered.map(v => buildCard(v, single)));
}

/* ============================ modal ============================ */

let ytPaused = false;

function postToPlayer(func) {
  $("player-iframe").contentWindow.postMessage(
    JSON.stringify({ event: "command", func, args: "" }), "*");
}

function openModal(v) {
  ytPaused = false;

  $("modal-num").textContent = `HEUTE ${v.id}`;
  $("modal-title").textContent = videoTitle(v);
  $("modal-tags").innerHTML =
    v.persons.map(p => personTag(p, true)).join("") + v.games.map(gameTag).join("");

  $("player-iframe").src =
    `https://www.youtube-nocookie.com/embed/${v.videoId}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1`;

  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  $("modal").classList.remove("open");
  $("player-iframe").src = "about:blank"; // stops playback; "" would reload this page into the frame
  document.body.style.overflow = "";
}

const modalIsOpen = () => $("modal").classList.contains("open");

$("close-btn").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
$("search").addEventListener("input", (e) => renderCards(e.target.value));

document.addEventListener("keydown", (e) => {
  if (!modalIsOpen()) return;

  if (e.key === "Escape") { closeModal(); return; }
  if (document.activeElement.tagName === "INPUT") return;

  if (e.code === "Space") {
    e.preventDefault();
    postToPlayer(ytPaused ? "playVideo" : "pauseVideo");
    ytPaused = !ytPaused;
  } else if (e.key.toLowerCase() === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.querySelector(".player-wrap").requestFullscreen().catch(() => {});
  }
});
</script>
</body>
</html>
