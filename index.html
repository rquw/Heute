<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heute.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --border: #2a2a2a;
    --border-hi: #444;
    --text: #f0f0f0;
    --muted: #666;
    --radius: 10px;
    --maxw: 900px;
    --ease: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body.locked > *:not(#gate) { display: none !important; }

  /* ---------- gate ---------- */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #gate[hidden] { display: none; }

  #gate-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #gate-input {
    width: 260px;
    padding: 15px 18px;
    text-align: center;
    font-family: inherit;
    font-size: 17px;
    letter-spacing: 3px;
    color: #222;
    background: #fbfbfb;
    border: 1px solid #e2e2e2;
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--ease), background var(--ease);
  }

  #gate-input:disabled { opacity: 0.6; }
  #gate-input::placeholder { color: #bbb; letter-spacing: 1px; }
  #gate-input:focus { border-color: #ccc; background: #fff; }

  #gate-input.shake {
    border-color: #e08080;
    animation: shake 0.35s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  #gate-error {
    height: 14px;
    font-size: 12px;
    letter-spacing: 0.3px;
    color: #c0392b;
    opacity: 0;
    transition: opacity var(--ease);
  }

  #gate-error.show { opacity: 1; }

  /* ---------- header + search ---------- */

  header {
    width: 100%;
    max-width: var(--maxw);
    padding: 60px 24px 24px;
    text-align: center;
  }

  header h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .search-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    max-width: var(--maxw);
    padding: 16px 24px 32px;
    background: linear-gradient(var(--bg) 85%, transparent);
  }

  #search {
    width: 100%;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color var(--ease);
  }

  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--border-hi); }

  .results-info {
    width: 100%;
    max-width: var(--maxw);
    padding: 0 24px 16px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- grid + cards ---------- */

  .grid {
    width: 100%;
    max-width: var(--maxw);
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .grid.single-result { grid-template-columns: 1fr; }

  .card {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color var(--ease), transform var(--ease);
  }

  .card:hover,
  .card:focus-visible { border-color: var(--border-hi); transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid #5a5aff; outline-offset: 2px; }

  .card.spotlight {
    grid-column: 1 / -1;
    max-width: 700px;
    margin: 0 auto;
    animation: spotlight-in 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes spotlight-in {
    from { opacity: 0.4; transform: scale(0.95); }
    to   { opacity: 1;   transform: scale(1); }
  }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* first frame of the video; sits above the fallback label */
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* shown behind the image only when the frame fails to load */
  .thumb-label {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #2a2a2a;
    user-select: none;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity var(--ease);
  }

  .card:hover .play-overlay,
  .card:focus-visible .play-overlay { opacity: 1; }

  .play-overlay svg { width: 48px; height: 48px; fill: #fff; }

  .card-body { padding: 14px 16px; }

  .card-num {
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-title {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }

  /* ---------- tags ---------- */

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: 4px;
    background: #222;
    color: #999;
    border: 1px solid #2c2c2c;
  }

  .tag.person { background: #1a1a2e; color: #8888cc; border-color: #2a2a4a; }
  .tag.game   { background: #1a2a1a; color: #77aa77; border-color: #2a3a2a; }

  /* ---------- modal ---------- */

  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.92);
  }

  .modal-bg.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 960px;
    padding: 0 20px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 14px;
  }

  .modal-num {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .modal-title { margin-top: 2px; font-size: 18px; font-weight: 700; }

  .close-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--muted);
    background: none;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color var(--ease), color var(--ease);
  }

  .close-btn:hover { border-color: var(--muted); color: var(--text); }

  .player-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .player-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 0 20px;
  }

  .no-results {
    grid-column: 1 / -1;
    padding: 60px 0;
    text-align: center;
    font-size: 15px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card:hover { transform: none; }
  }

  /* ---------- fresh (< 7 days) ---------- */

  .card.fresh {
    border-color: #e6c200;
    box-shadow: 0 0 0 1px #e6c200, 0 0 24px -4px rgba(230, 194, 0, 0.55);
  }

  .card.fresh:hover,
  .card.fresh:focus-visible {
    border-color: #ffdb1a;
    box-shadow: 0 0 0 1px #ffdb1a, 0 0 28px -2px rgba(255, 219, 26, 0.7);
  }

  @keyframes fresh-pulse {
    0%, 100% { box-shadow: 0 0 0 1px #e6c200, 0 0 20px -6px rgba(230, 194, 0, 0.45); }
    50%      { box-shadow: 0 0 0 1px #ffdb1a, 0 0 30px -2px rgba(255, 219, 26, 0.75); }
  }

  .card.fresh { animation: fresh-pulse 2.6s ease-in-out infinite; }

  .badge-new {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 2;
    padding: 3px 9px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #1a1400;
    background: #ffd21a;
    border-radius: 20px;
  }

  /* ---------- native (catbox) video thumb ---------- */

  .thumb video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  .player-wrap video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  /* ---------- owner: add tile + form ---------- */

  .card.add {
    background: transparent;
    border-style: dashed;
    border-color: #333;
  }

  .card.add:hover,
  .card.add:focus-visible {
    border-color: #ffd21a;
    transform: translateY(-2px);
    box-shadow: none;
  }

  .card.add .thumb { background: transparent; }

  .add-plus {
    font-size: 46px;
    font-weight: 200;
    line-height: 1;
    color: #555;
    transition: color var(--ease);
  }

  .card.add:hover .add-plus,
  .card.add:focus-visible .add-plus { color: #ffd21a; }

  .add-cap {
    padding: 14px 16px;
    font-size: 13px;
    color: var(--muted);
  }

  #addform-fields { display: flex; flex-direction: column; gap: 12px; }

  #addform label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  #addform input {
    width: 100%;
    padding: 11px 13px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: #111;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color var(--ease);
  }

  #addform input:focus { border-color: var(--border-hi); }

  .add-actions { display: flex; gap: 10px; padding-top: 6px; }

  .btn {
    padding: 11px 18px;
    font: inherit;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #1a2a1a;
    color: #cfe6cf;
    transition: border-color var(--ease);
  }

  .btn:hover { border-color: #3a5a3a; }
  .btn.ghost { background: none; color: var(--muted); }
  .btn.ghost:hover { border-color: var(--muted); color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .add-status { padding-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .add-status.err { color: #e08080; }
  .add-status.ok { color: #77aa77; }
</style>
</head>
<body class="locked">

<div id="gate">
  <form id="gate-form" autocomplete="off">
    <input id="gate-input" type="password" placeholder="passwort" autocomplete="off" aria-label="passwort">
    <div id="gate-error" role="alert">falsch.</div>
  </form>
</div>

<header><h1>heute.</h1></header>

<div class="search-wrap">
  <input id="search" type="search" autocomplete="off" aria-label="suche"
         placeholder="suche nach video, person, spiel… mehrere tags mit leerzeichen trennen">
</div>

<div class="results-info" id="results-info" aria-live="polite"></div>
<div class="grid" id="grid"></div>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-num" id="modal-num"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="close-btn" id="close-btn" aria-label="schließen">×</button>
    </div>

    <div class="player-wrap" id="player-wrap"></div>

    <div class="modal-tags" id="modal-tags"></div>
  </div>
</div>

<div class="modal-bg" id="add" role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-num">NEUES VIDEO</div>
        <div class="modal-title" id="add-title">heute hinzufügen</div>
      </div>
      <button class="close-btn" id="add-close" aria-label="schließen">×</button>
    </div>

    <form id="addform" autocomplete="off">
      <div id="addform-fields">
        <div>
          <label for="add-yt">youtube-url oder video-id (optional)</label>
          <input id="add-yt" type="text" placeholder="https://youtu.be/…">
        </div>
        <div>
          <label for="add-file">catbox-/datei-url .mp4 (optional)</label>
          <input id="add-file" type="text" placeholder="https://files.catbox.moe/….mp4">
        </div>
        <div>
          <label for="add-persons">spieler (mit komma trennen)</label>
          <input id="add-persons" type="text" placeholder="rquw, CloudMelt, …">
        </div>
        <div>
          <label for="add-games">games (mit komma trennen)</label>
          <input id="add-games" type="text" placeholder="Minecraft, Fortnite, …">
        </div>
      </div>
      <div class="add-actions">
        <button type="submit" class="btn" id="add-submit">hinzufügen &amp; live schalten</button>
        <button type="button" class="btn ghost" id="add-cancel">abbrechen</button>
      </div>
      <div class="add-status" id="add-status"></div>
    </form>
  </div>
</div>

/* ============================ crypto ============================ */

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bytesToB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKek(password, salt, usage) {
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: BLOB.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, [usage]);
}

// returns { payload, owner, contentKey } or null if the password fits no wrap
async function decryptPayload(password) {
  for (const w of BLOB.wraps) {
    try {
      const kek = await deriveKek(password, b64ToBytes(w.salt), "decrypt");
      const rawKey = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(w.iv) }, kek, b64ToBytes(w.key));
      // extractable + encrypt usage so the owner can re-encrypt when adding videos
      const contentKey = await crypto.subtle.importKey(
        "raw", rawKey, "AES-GCM", true, ["encrypt", "decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(BLOB.iv) }, contentKey, b64ToBytes(BLOB.ct));
      return { payload: JSON.parse(new TextDecoder().decode(plain)),
               owner: !!w.owner, contentKey };
    } catch {
      // wrong password for this wrap (GCM tag mismatch) — try the next one
    }
  }
  return null;
}

let PEOPLE = {};

const aliasesOf = (p) => PEOPLE[p]?.aka || [];

function isFresh(v) {
  if (!v.uploaded) return false;
  const days = (Date.now() - new Date(v.uploaded + "T00:00:00").getTime()) / 864e5;
  return days >= 0 && days < FRESH_DAYS;
}

function showGateError() {
  const input = $("gate-input");
  $("gate-error").classList.add("show");
  input.classList.remove("shake");
  void input.offsetWidth; // restart the animation
  input.classList.add("shake");
  input.value = "";
}

function unlockSite(res) {
  PEOPLE = res.payload.people;
  VIDEOS = res.payload.videos;
  CONTENT_KEY = res.contentKey;
  IS_OWNER = res.owner;
  document.body.classList.remove("locked");
  $("gate").hidden = true;
  renderCards("");
  $("search").focus();
}

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("gate-input");
  if (!input.value) return;

  input.disabled = true;
  const res = await decryptPayload(input.value); // PBKDF2 is intentionally slow
  input.disabled = false;

  if (res) unlockSite(res);
  else { showGateError(); input.focus(); }
});

$("gate-input").addEventListener("input", () => $("gate-error").classList.remove("show"));
$("gate-input").focus();

/* ============================ search ============================ */

// "Make It Meme" -> ["make","it","meme"]
const wordsOf = (str) => String(str || "").toLowerCase().split(/\s+/).filter(Boolean);

function matchesToken(v, token) {
  const t = token.toLowerCase();
  if (!t || t === "heute") return true;

  const num = t.match(/^(?:heute\s*)?(\d+)$/);
  if (num && Number(num[1]) === v.id) return true;

  // word-prefix match instead of includes-anywhere, so "it" doesn't hit "Fortnite" or "Kit"
  const hit = (str) => wordsOf(str).some(w => w.startsWith(t));
  const personHit = (p) => hit(p) || hit(realName(p)) || aliasesOf(p).some(hit);
  return v.persons.some(personHit) || v.games.some(hit);
}

const matches = (v, q) =>
  q.trim().split(/\s+/).filter(Boolean).every(tok => matchesToken(v, tok));

/* ============================ rendering ============================ */

const escapeHtml = (str) =>
  String(str).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const personTag = (p, withReal) =>
  `<span class="tag person"${withReal ? "" : ` title="${escapeHtml(realName(p))}"`}>` +
  escapeHtml(withReal ? `${p} (${realName(p)})` : p) + `</span>`;

const gameTag = (g) => `<span class="tag game">${escapeHtml(g)}</span>`;

// a youtube still that falls back maxres -> mqdefault -> nothing
function ytImg(v) {
  const img = document.createElement("img");
  img.src = ytThumb(v.videoId);
  img.alt = `thumbnail von heute ${v.id}`;
  img.loading = "lazy";
  img.decoding = "async";
  img.addEventListener("error", () => {
    if (img.dataset.retried) img.remove();
    else { img.dataset.retried = "1"; img.src = ytThumb(v.videoId, "mqdefault"); }
  });
  return img;
}

function buildThumb(v) {
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  thumb.innerHTML =
    (isFresh(v) ? '<span class="badge-new">neu</span>' : "") +
    `<span class="thumb-label">heute ${v.id}</span>
     <div class="play-overlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>`;

  if (v.file) {
    // native first frame; on failure fall back to the youtube still, then the label
    const vid = document.createElement("video");
    vid.src = v.file;
    vid.muted = true;
    vid.playsInline = true;
    vid.preload = "metadata";
    vid.tabIndex = -1;
    vid.addEventListener("loadeddata", () => { try { vid.currentTime = 0.05; } catch {} });
    vid.addEventListener("error", () => {
      vid.remove();
      if (v.videoId) thumb.prepend(ytImg(v));
    });
    thumb.prepend(vid);
  } else if (v.videoId) {
    thumb.prepend(ytImg(v));
  }

  return thumb;
}

function buildCard(v, spotlight) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card" + (spotlight ? " spotlight" : "") + (isFresh(v) ? " fresh" : "");
  card.addEventListener("click", () => openModal(v));

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    <div class="card-num">heute ${v.id}</div>
    <div class="card-title">${escapeHtml(videoTitle(v))}</div>
    <div class="tags">
      ${v.persons.map(p => personTag(p, false)).join("")}
      ${v.games.map(gameTag).join("")}
    </div>`;

  card.append(buildThumb(v), body);
  return card;
}

function buildAddTile() {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card add";
  card.setAttribute("aria-label", "neues video hinzufügen");
  card.addEventListener("click", openAdd);
  card.innerHTML = `
    <div class="thumb"><span class="add-plus">+</span></div>
    <div class="add-cap">neues video</div>`;
  return card;
}

function renderCards(q) {
  const grid = $("grid");
  const info = $("results-info");
  const filtered = VIDEOS.filter(v => matches(v, q));

  grid.replaceChildren();

  if (!filtered.length) {
    grid.className = "grid";
    grid.innerHTML = '<div class="no-results">nichts gefunden.</div>';
    info.textContent = "";
    return;
  }

  const single = filtered.length === 1 && !IS_OWNER;
  grid.className = "grid" + (single ? " single-result" : "");
  info.textContent = filtered.length === VIDEOS.length
    ? `${VIDEOS.length} videos`
    : `${filtered.length} von ${VIDEOS.length} videos`;

  grid.append(...filtered.map(v => buildCard(v, single)));
  // owner-only "add" tile, shown when browsing the full list
  if (IS_OWNER && !q.trim()) grid.append(buildAddTile());
}

/* ============================ modal / player ============================ */

let ytPaused = false;

function clearPlayer() {
  const wrap = $("player-wrap");
  const vid = wrap.querySelector("video");
  if (vid) { vid.pause(); vid.removeAttribute("src"); vid.load(); }
  wrap.replaceChildren();
}

function mountYouTube(v) {
  clearPlayer();
  const iframe = document.createElement("iframe");
  iframe.title = "video";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
  iframe.allowFullscreen = true;
  iframe.src = `https://www.youtube-nocookie.com/embed/${v.videoId}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1`;
  $("player-wrap").append(iframe);
}

function mountVideo(v) {
  clearPlayer();
  const vid = document.createElement("video");
  vid.src = v.file;
  vid.controls = true;
  vid.autoplay = true;
  vid.playsInline = true;
  // catbox down / rate-limited / dead file -> silently fall back to youtube
  vid.addEventListener("error", () => { if (v.videoId) mountYouTube(v); });
  $("player-wrap").append(vid);
}

function openModal(v) {
  ytPaused = false;

  $("modal-num").textContent = `HEUTE ${v.id}`;
  $("modal-title").textContent = videoTitle(v);
  $("modal-tags").innerHTML =
    v.persons.map(p => personTag(p, true)).join("") + v.games.map(gameTag).join("");

  if (v.file) mountVideo(v);
  else mountYouTube(v);

  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  $("modal").classList.remove("open");
  clearPlayer();
  document.body.style.overflow = "";
}

const anyModalOpen = () =>
  $("modal").classList.contains("open") || $("add").classList.contains("open");

$("close-btn").addEventListener("click", closeModal);
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
$("search").addEventListener("input", (e) => renderCards(e.target.value));

document.addEventListener("keydown", (e) => {
  if (!$("modal").classList.contains("open")) return;
  if (e.key === "Escape") { closeModal(); return; }
  if (document.activeElement.tagName === "INPUT") return;

  const wrap = $("player-wrap");
  const vid = wrap.querySelector("video");
  const iframe = wrap.querySelector("iframe");

  if (e.code === "Space") {
    e.preventDefault();
    if (vid) { vid.paused ? vid.play() : vid.pause(); }
    else if (iframe) {
      iframe.contentWindow.postMessage(
        JSON.stringify({ event: "command", func: ytPaused ? "playVideo" : "pauseVideo", args: "" }), "*");
      ytPaused = !ytPaused;
    }
  } else if (e.key.toLowerCase() === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else wrap.requestFullscreen().catch(() => {});
  }
});

const YT_ID = /(?:v=|\/embed\/|youtu\.be\/|\/shorts\/)([A-Za-z0-9_-]{11})/;
const parseYt = (s) => {
  s = s.trim();
  if (!s) return "";
  const m = s.match(YT_ID);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : "";
};
const splitList = (s) => s.split(",").map(x => x.trim()).filter(Boolean);
const todayISO = () => new Date().toISOString().slice(0, 10);

// re-encrypt the current data with the SAME content key (wraps stay valid)
async function rebuildBlob() {
  const bytes = new TextEncoder().encode(JSON.stringify({ people: PEOPLE, videos: VIDEOS }));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, CONTENT_KEY, bytes);
  return { ...BLOB, iv: bytesToB64(iv), ct: bytesToB64(ct) };
}

async function buildNewIndexHtml(newBlob) {
  const src = await (await fetch(location.href, { cache: "no-store" })).text();
  const line = "const BLOB = " + JSON.stringify(newBlob) + ";";
  // anchored on {"v": so it hits the data line, not the code that mentions "const BLOB"
  const re = /const BLOB = \{"v":.*\};/;
  if (!re.test(src)) throw new Error("BLOB-zeile nicht gefunden");
  return src.replace(re, () => line);
}

async function publish(html) {
  if (PUBLISH_URL) {
    const secret = sessionStorage.getItem("heute_pub") ||
      prompt("publish-secret (einmal pro sitzung):") || "";
    sessionStorage.setItem("heute_pub", secret);
    const r = await fetch(PUBLISH_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ secret, html }),
    });
    if (!r.ok) {
      if (r.status === 401 || r.status === 403) sessionStorage.removeItem("heute_pub");
      throw new Error("worker: " + r.status + " " + (await r.text()).slice(0, 120));
    }
    return "live geschaltet — in ~1 min sichtbar.";
  }
  // no worker configured -> hand over the finished file to commit manually
  const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  const a = document.createElement("a");
  a.href = url; a.download = "index.html";
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  return "index.html heruntergeladen — 1 commit und es ist live.";
}

$("addform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const videoId = parseYt($("add-yt").value);
  const file = $("add-file").value.trim();
  const persons = splitList($("add-persons").value);
  const games = splitList($("add-games").value);

  if (!videoId && !file) return setAddStatus("youtube-url oder datei-url angeben.", "err");
  if ($("add-yt").value.trim() && !videoId) return setAddStatus("youtube-url nicht erkannt.", "err");
  if (!persons.length) return setAddStatus("mindestens einen spieler angeben.", "err");
  if (!games.length) return setAddStatus("mindestens ein game angeben.", "err");

  const v = {
    id: Math.max(0, ...VIDEOS.map(x => x.id)) + 1,
    persons, games, uploaded: todayISO(),
  };
  if (videoId) v.videoId = videoId;
  if (file) v.file = file;

  const submit = $("add-submit");
  submit.disabled = true;
  setAddStatus("verschlüssle & veröffentliche…");

  VIDEOS.push(v);
  try {
    const html = await buildNewIndexHtml(await rebuildBlob());
    const msg = await publish(html);
    setAddStatus("heute " + v.id + " hinzugefügt. " + msg, "ok");
    renderCards("");
    $("search").value = "";
    setTimeout(closeAdd, 1400);
  } catch (err) {
    VIDEOS.pop(); // roll back the optimistic add
    setAddStatus("fehlgeschlagen: " + err.message, "err");
  } finally {
    submit.disabled = false;
  }
});
</script>
